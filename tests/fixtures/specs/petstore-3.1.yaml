openapi: "3.1.0"
info:
  title: Petstore (OpenAPI 3.1)
  version: "1.0.0"
  description: A sample Petstore API using OpenAPI 3.1 features
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a specific pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        tag:
          type:
            - string
            - "null"
        status:
          const: active
        nicknames:
          type: array
          prefixItems:
            - type: string
            - type: string
          items: false
        metadata:
          type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedBy:
              type:
                - string
                - "null"

    PetInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        tag:
          type:
            - string
            - "null"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
