swagger: "2.0"
info:
  title: Petstore
  version: 1.0.0
  description: A sample Pet Store API
host: petstore.swagger.io
basePath: /v1
schemes:
  - http
produces:
  - application/json
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return (max 100)
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: A list of pets
          headers:
            x-next:
              description: A link to the next page of responses
              type: string
          schema:
            $ref: "#/definitions/Pets"
          examples:
            application/json:
              - id: 1
                name: "Buddy"
                tag: "dog"
              - id: 2
                name: "Whiskers"
                tag: "cat"
        default:
          description: unexpected error
          schema:
            $ref: "#/definitions/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Pet"
      responses:
        "201":
          description: Null response
        default:
          description: unexpected error
          schema:
            $ref: "#/definitions/Error"
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          type: string
      responses:
        "200":
          description: Expected response to a valid request
          schema:
            $ref: "#/definitions/Pet"
          examples:
            application/json:
              id: 1
              name: "Buddy"
              tag: "dog"
        default:
          description: unexpected error
          schema:
            $ref: "#/definitions/Error"
definitions:
  Pet:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      tag:
        type: string
  Pets:
    type: array
    maxItems: 100
    items:
      $ref: "#/definitions/Pet"
  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
